# Render Blueprint: one Docker web service that serves BOTH the API (/api/*) and the built React
# app, on one origin. See deploy/README.md for the step-by-step.
services:
  - type: web
    name: nts-school-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # FREE plan: no cost, but the service goes to sleep after ~15 minutes without traffic and takes
    # roughly a minute to wake on the next visit (users see a slow first page load). Change to
    # `starter` (about $7/month) for an always-on service - nothing else needs to change.
    plan: free
    region: frankfurt        # pick the region closest to your Neon database and your users
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    # (Migrations run in deploy/start.sh - Render's pre-deploy hook isn't available on the free plan.)
    domains:
      - school.ntsdigitalsolutions.com
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: school.ntsdigitalsolutions.com,nts-school-system.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://school.ntsdigitalsolutions.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://school.ntsdigitalsolutions.com
      - key: FRONTEND_URL
        value: https://school.ntsdigitalsolutions.com
      # Trusted proxy hops between the internet and gunicorn. VERIFY after the first deploy — see
      # deploy/README.md section 5 (a wrong value mis-attributes client IPs).
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      # Free instances have 512 MB of RAM: 2 workers x 2 threads fits comfortably.
      - key: WEB_CONCURRENCY
        value: "2"
      # Generated by Render on first deploy, stored as a secret, never in git.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Encrypts the two-factor (authenticator) secrets stored in the database. Separate from
      # DJANGO_SECRET_KEY so rotating that never invalidates everyone's enrolled authenticator.
      # Do NOT change it after users have enrolled, or they will all have to re-enrol.
      - key: TWO_FACTOR_ENCRYPTION_KEY
        generateValue: true
      # Secrets you paste into the Render dashboard (sync: false = not stored in this file).
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: NTS School System
      - key: DAILY_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
